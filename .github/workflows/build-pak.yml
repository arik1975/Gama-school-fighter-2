name: Build GAMA SCHOOL FIGHTER 2 PAK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q GAMA_SCHOOL_FIGHTER_2_6391_READY.zip -d extracted
          find extracted -maxdepth 5 -type f

      - name: Get borpak
        run: |
          git clone --depth 1 https://github.com/DCurrent/openbor.git openbor

      - name: Build borpak
        run: |
          cd openbor/tools/borpak
          gcc -O2 -o borpak borpak.c stristr.c scandir.c
          chmod +x borpak

      - name: Locate game data
        run: |
          DATA=$(find extracted -type d -name data | head -1)

          if [ -z "$DATA" ]; then
            echo "Folder data tidak ditemukan!"
            exit 1
          fi

          echo "DATA=$DATA" >> "$GITHUB_ENV"
          echo "Data ditemukan di: $DATA"

      - name: Build PAK
        run: |
          mkdir -p out
          ./openbor/tools/borpak/borpak \
            -b \
            -d "$DATA" \
            out/GAMA_SCHOOL_FIGHTER_2.pak

      - name: Check PAK
        run: |
          ls -lh out/GAMA_SCHOOL_FIGHTER_2.pak
          file out/GAMA_SCHOOL_FIGHTER_2.pak

      - name: Upload PAK
        uses: actions/upload-artifact@v4
        with:
          name: GAMA-SCHOOL-FIGHTER-2-PAK
          path: out/GAMA_SCHOOL_FIGHTER_2.pak
